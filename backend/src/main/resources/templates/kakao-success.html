<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로그인 성공</title>
</head>
<body>
<h1>카카오 로그인 성공!</h1>
<p>안녕하세요, <span th:text="${user.name}">[이름]</span>님</p>
<p>회원 가입일: <span th:text="${user.joinedAt}">[가입일]</span></p>

<form th:action="@{/auth/logout}" method="post" style="display:inline">
    <button type="submit">로그아웃</button>
</form>

</body>
</html>
