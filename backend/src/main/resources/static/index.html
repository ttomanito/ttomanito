<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Chat & Poke Test</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>
<body>
<h1>1:1 Chat & Poke Test</h1>

<div>
    <label>ChatRoom ID: <input id="chatRoomId" value="1" /></label>
    <label>My RoomUserId: <input id="myUserId" value="1" /></label>
    <button id="connectBtn">Connect</button>
</div>

<div id="chat" style="margin-top:1em;">
    <ul id="messages" style="list-style:none; padding:0;"></ul>
    <div>
        <input id="msgInput" placeholder="Type a chat message..." />
        <button id="sendBtn">Send</button>
        <button id="pokeBtn">Poke 🫵</button>
    </div>
</div>

<script>
    let stompClient;

    document.getElementById('connectBtn').onclick = () => {
        const chatRoomId = document.getElementById('chatRoomId').value;
        const socket = new SockJS('/ws/chat');
        stompClient = Stomp.over(socket);
        stompClient.connect({}, () => {
            // 1) 과거 히스토리 요청
            stompClient.subscribe('/user/queue/history', res => {
                JSON.parse(res.body).forEach(m => addMessage(m));
            });
            stompClient.send(`/app/chat.history.${chatRoomId}`, {}, {});

            // 2) 실시간 메시지 구독
            stompClient.subscribe(`/topic/chat.${chatRoomId}`, res => {
                const m = JSON.parse(res.body);
                addMessage(m);
            });
        });
    };

    document.getElementById('sendBtn').onclick = () => {
        const chatRoomId = document.getElementById('chatRoomId').value;
        const sender = document.getElementById('myUserId').value;
        const content = document.getElementById('msgInput').value.trim();
        if (!content) return;
        const payload = {
            chattingchatRoomId: +chatRoomId,
            senderRoomUserId: +sender,
            content: content
        };
        stompClient.send(
            `/app/chat.send.${chatRoomId}`,
            { 'content-type': 'application/json' },
            JSON.stringify(payload)
        );
        document.getElementById('msgInput').value = '';
    };

    document.getElementById('pokeBtn').onclick = () => {
        const chatRoomId = document.getElementById('chatRoomId').value;
        const sender = document.getElementById('myUserId').value;
        const payload = {
            chattingchatRoomId: +chatRoomId,
            senderRoomUserId: +sender
        };
        stompClient.send(
            `/app/chat.poke.${chatRoomId}`,
            { 'content-type': 'application/json' },
            JSON.stringify(payload)
        );
    };

    function addMessage(m) {
        const li = document.createElement('li');
        const time = new Date(m.sentAt).toLocaleTimeString();
        li.textContent = `[${time}] ${m.senderRoomUserId}: ${m.content}`;
        document.getElementById('messages').append(li);
    }
</script>
</body>
</html>
