# \uC11C\uBC84 \uD3EC\uD2B8
server.port=${SPRING_PORT:8080}


# MySQL \uC124\uC815
spring.datasource.url=jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&serverTimezone=Asia/Seoul
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}

# JPA \uC124\uC815
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# \uD55C\uAE00 \uC778\uCF54\uB529 \uC124\uC815
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.enabled=true
spring.servlet.encoding.force=true

# MongoDB \uC124\uC815 (MongoTemplate \uB4F1 \uC0AC\uC6A9\uD560 \uACBD\uC6B0)
spring.data.mongodb.uri=mongodb://mongo:27017/${MONGO_DATABASE}

# Redis\uC124\uC815
spring.data.redis.host=${SPRING_REDIS_HOST}
spring.data.redis.port=6379