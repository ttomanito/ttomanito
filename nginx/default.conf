server {
    listen 80;
    server_name i13b206.p.ssafy.io;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name i13b206.p.ssafy.io;

    ssl_certificate /etc/letsencrypt/live/i13b206.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/i13b206.p.ssafy.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        # WebSocket(STOMP/SockJS) 업그레이드
    location ^~ /ws/ {
        proxy_pass             http://backend-app:8080/ws/;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade $http_upgrade;
        proxy_set_header       Connection "Upgrade";
        proxy_set_header       Host $host;
        proxy_set_header       Authorization $http_authorization;
        proxy_set_header       userId        $http_userid;
        proxy_set_header       roomId        $http_roomid;
    }
    
    location /v3/api-docs {
        proxy_pass http://backend-app:8080/v3/api-docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 캐시 방지 헤더 추가
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
        
    }

    location /swagger-ui/ {
        proxy_pass http://backend-app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 캐시 방지 헤더 추가
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }
    location /login/ {
        proxy_pass http://backend-app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 캐시 방지 헤더 추가
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
        # proxy_set_header X-Forwarded-Proto $scheme;

    }
    location /oauth2/ {
        proxy_pass http://backend-app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 캐시 방지 헤더 추가
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
        # proxy_set_header X-Forwarded-Proto $scheme;
    }


    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend-app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 캐시 방지 헤더 추가
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
        # proxy_set_header X-Forwarded-Proto $scheme;

    }


 # OpenVidu REST + WebSocket
    location /openvidu/ {
        proxy_pass              https://openvidu-server-kms:443/;
        proxy_http_version      1.1;

        # WebSocket
        proxy_set_header        Upgrade $http_upgrade;
        proxy_set_header        Connection "upgrade";

        # 원본 정보 전달
        proxy_set_header        Host $host;
        proxy_set_header        X-Real-IP $remote_addr;
        proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;

        # ⬇️ 업스트림 TLS
        proxy_ssl_verify        off;              # self-signed 허용
        proxy_ssl_server_name   off;              # SNI 끄기 (중요)
        # 선택: 프로토콜/암호군 명시 (상황에 따라 도움됨)
        proxy_ssl_protocols     TLSv1.2 TLSv1.3;
        # proxy_ssl_ciphers     HIGH:!aNULL:!MD5;

        proxy_read_timeout      86400;
        proxy_send_timeout      86400;
    }


    location / {
        root /usr/share/nginx/html;
        index index.html;

        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;

        try_files $uri /index.html;
    }

    

}