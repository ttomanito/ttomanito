    location = /jenkins {
        return 301 /jenkins/;
    }
    location ^~ /jenkins/ {
        # Docker 컨테이너에서 호스트 머신(EC2)의 Jenkins 포트(8080)로 요청을 전달합니다.
        # 'host.docker.internal'은 컨테이너가 호스트 머신을 가리키는 특수한 주소입니다.
        proxy_pass http://host.docker.internal:8080/jenkins/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;   # <-- 반드시 https로 고정
        proxy_set_header X-Forwarded-Port  443;     # <-- 443 명시
        proxy_set_header X-Forwarded-Prefix /jenkins;

        # Jenkins가 리버스 프록시 뒤에서 올바르게 동작하기 위한 필수 설정
        proxy_redirect          off;
        proxy_buffering         off;
        proxy_request_buffering off;
        client_max_body_size    0;
        proxy_read_timeout      3600s;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;

        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;

        try_files $uri /index.html;
    }

}
